networks:
  company-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mysql-db:
    image: mysql:8.0
    container_name: warranty-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: warranty_db
      MYSQL_USER: warranty_user
      MYSQL_PASSWORD: securepass123
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - company-network
    restart: unless-stopped

  web:
    build: .
    container_name: warranty-web
    environment:
      DB_HOST: mysql-db
      DB_USER: warranty_user
      DB_PASSWORD: securepass123
      DB_NAME: warranty_db
    ports:
      - "5000:5000"
    networks:
      - company-network
    depends_on:
      - mysql-db
    restart: unless-stopped